<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador del menú | Be'er Sheva 113</title>
<script src="menu-data.js"></script>
<style>
:root{--bg:#111;--panel:#1a1a1a;--line:#303030;--gold:#d4af37;--green:#395740;--text:#eee;--muted:#aaa;--danger:#b84a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}main{max-width:1400px;margin:auto;padding:28px}h1,h2{font-family:Georgia,serif;font-weight:500}header{border-bottom:1px solid var(--line);padding:20px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{color:var(--gold);font:24px Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:10px 14px;cursor:pointer;border-radius:3px}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.danger{border-color:var(--danger);color:#ff9a9a}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{width:100%;background:#101010;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:3px;font:inherit}textarea{min-height:90px;resize:vertical}label{display:block;color:var(--muted);margin:12px 0 5px}.item-list{display:grid;gap:8px;max-height:70vh;overflow:auto}.item-row{border:1px solid var(--line);padding:10px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}.item-row.active{border-color:var(--gold)}.item-row small{display:block;color:var(--muted);margin-top:4px}.status{color:var(--gold);min-height:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{margin:0}.checks input{width:auto}.empty{color:var(--muted);padding:20px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.item-list{max-height:35vh}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><div class="brand">Be'er Sheva 113</div><div>Administrador del menú</div></div><div class="actions"><button id="btn-nuevo" class="primary">Nuevo plato</button><button id="btn-exportar">Exportar menu-data.js</button><a class="button" href="menu.html">Ver menú</a></div></header>
<main><p class="status" id="estado"></p><div class="layout"><aside class="panel"><div class="toolbar"><input id="buscar" placeholder="Buscar plato..."><select id="filtro"><option value="all">Todas las categorías</option><option value="base">Bases</option><option value="proteina">Proteínas</option><option value="salsa">Salsas</option><option value="acompanamiento">Acompañamientos</option><option value="bebida">Bebidas</option></select></div><div id="lista" class="item-list"></div><hr style="border-color:var(--line);margin:20px 0"><button id="btn-nuevo-combo">Nuevo combo</button><div id="lista-combos" class="item-list" style="margin-top:10px"></div></aside><section class="panel"><h1 id="titulo-form">Selecciona un plato</h1><form id="formulario" hidden><div class="grid2"><div><label for="id">ID único</label><input id="id" required></div><div><label for="categoria">Categoría</label><select id="categoria"><option value="base">Base</option><option value="proteina">Proteína</option><option value="salsa">Salsa</option><option value="acompanamiento">Acompañamiento</option><option value="bebida">Bebida</option></select></div></div><div class="checks"><label><input type="checkbox" id="activo"> Visible en el menú</label></div><div class="grid2"><div><label for="nombre-es">Nombre español</label><input id="nombre-es" required></div><div><label for="nombre-en">English name</label><input id="nombre-en"></div></div><label for="nombre-fr">Nom français</label><input id="nombre-fr"><label for="descripcion-es">Descripción en español</label><textarea id="descripcion-es"></textarea><label for="descripcion-en">English description</label><textarea id="descripcion-en"></textarea><label for="descripcion-fr">Description française</label><textarea id="descripcion-fr"></textarea><label for="precio">Precio base en COP</label><input id="precio" type="number" min="0" step="100" required><div class="actions" style="margin-top:18px"><button class="primary" type="submit">Guardar plato</button><button class="danger" type="button" id="btn-eliminar">Eliminar</button></div></form><form id="formulario-combo" hidden><div class="grid2"><div><label for="combo-id">ID único</label><input id="combo-id" required></div><div><label><input type="checkbox" id="combo-activo"> Visible en el menú</label></div></div><label for="combo-nombre-es">Nombre en español</label><input id="combo-nombre-es" required><div class="grid2"><div><label for="combo-nombre-en">English name</label><input id="combo-nombre-en"></div><div><label for="combo-nombre-fr">Nom français</label><input id="combo-nombre-fr"></div></div><label for="combo-desc-es">Descripción en español</label><textarea id="combo-desc-es"></textarea><div class="grid2"><div><label for="combo-desc-en">English description</label><textarea id="combo-desc-en"></textarea></div><div><label for="combo-desc-fr">Description française</label><textarea id="combo-desc-fr"></textarea></div></div><label for="combo-items">IDs de platos, separados por coma</label><input id="combo-items" placeholder="chk-base-crepe, chk-prot-pollo"><div class="grid2"><div><label for="combo-regular">Precio regular COP</label><input id="combo-regular" type="number" min="0"></div><div><label for="combo-descuento">Precio con descuento COP</label><input id="combo-descuento" type="number" min="0"></div></div><div class="actions" style="margin-top:18px"><button class="primary" type="submit">Guardar combo</button><button class="danger" type="button" id="btn-eliminar-combo">Eliminar</button></div></form><div id="sin-seleccion" class="empty">Crea un plato o combo nuevo, o selecciona uno de la lista.</div></section></div></main>
<script>
const STORAGE_KEY='beersheva-admin-draft';let data={version:1,settings:{discountPercent:30,rates:{COP:1,USD:3200,EUR:3700}},items:[],combos:[]};let seleccionado=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'');
function inicializar(){try{const draft=localStorage.getItem(STORAGE_KEY);if(draft){const parsed=JSON.parse(draft);const legacyDraft=parsed.items?.length>0&&parsed.items.every(item=>item.active===false);if(!legacyDraft)data=parsed}}catch{} if(!data.items.length){data=JSON.parse(JSON.stringify(window.menuData||data));} if(!data.items.length) cargarMenuActual(); renderLista();}
function cargarMenuActual(){const frame=document.createElement('iframe');frame.hidden=true;frame.src='menu.html?lang=es';document.body.appendChild(frame);frame.onload=()=>{const items=[...frame.contentDocument.querySelectorAll('input[type="checkbox"][data-precio]')].map(input=>{const box=input.parentElement;const spans=box.querySelectorAll(':scope > div span');return{id:input.id,category:input.name,active:true,name:{es:spans[0]?.textContent.trim()||input.value,en:'',fr:''},description:{es:spans[1]?.textContent.trim()||'',en:'',fr:''},price:Number(input.dataset.precio)||0}});if(items.length){data.items=items;guardar('Menú actual cargado');renderLista()}frame.remove()};}
function guardar(msg='Cambios guardados en este navegador'){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));$('estado').textContent=msg;setTimeout(()=>{$('estado').textContent=''},2500)}
function renderLista(){const q=$('buscar').value.toLowerCase();const cat=$('filtro').value;const rows=data.items.filter(x=>(cat==='all'||x.category===cat)&&`${x.name?.es} ${x.id}`.toLowerCase().includes(q));$('lista').innerHTML=rows.map(x=>`<div class="item-row ${x.id===seleccionado?'active':''}" data-id="${encodeURIComponent(x.id)}"><span>${esc(x.name?.es||x.id)}<small>${x.category} · ${x.active===false?'Oculto':'Visible'} · $${Number(x.price||0).toLocaleString('es-CO')}</small></span><span>${x.active===false?'○':'●'}</span></div>`).join('')||'<div class="empty">No hay platos.</div>';document.querySelectorAll('#lista .item-row').forEach(row=>row.onclick=()=>editar(decodeURIComponent(row.dataset.id)));renderCombos()}
function renderCombos(){$('lista-combos').innerHTML=(data.combos||[]).map(x=>`<div class="item-row" data-combo-id="${encodeURIComponent(x.id)}"><span>${esc(x.name?.es||x.id)}<small>${x.active===false?'Oculto':'Visible'} · ${x.items?.length||0} platos</small></span><span>✦</span></div>`).join('')||'<div class="empty">No hay combos.</div>';document.querySelectorAll('[data-combo-id]').forEach(row=>row.onclick=()=>editarCombo(decodeURIComponent(row.dataset.comboId)))}
function editar(id){seleccionado=id;const x=data.items.find(i=>i.id===id);if(!x)return;$('titulo-form').textContent='Editar plato';$('formulario').hidden=false;$('sin-seleccion').hidden=true;$('id').value=x.id;$('id').disabled=true;$('categoria').value=x.category;$('activo').checked=x.active!==false;$('nombre-es').value=x.name?.es||'';$('nombre-en').value=x.name?.en||'';$('nombre-fr').value=x.name?.fr||'';$('descripcion-es').value=x.description?.es||'';$('descripcion-en').value=x.description?.en||'';$('descripcion-fr').value=x.description?.fr||'';$('precio').value=x.price||0;renderLista()}
function nuevo(){seleccionado=null;$('titulo-form').textContent='Nuevo plato';$('formulario').hidden=false;$('formulario-combo').hidden=true;$('sin-seleccion').hidden=true;$('formulario').reset();$('id').disabled=false;$('activo').checked=true;$('categoria').value='base'}
function nuevoCombo(){seleccionado=null;$('titulo-form').textContent='Nuevo combo';$('formulario').hidden=true;$('formulario-combo').hidden=false;$('sin-seleccion').hidden=true;$('formulario-combo').reset();$('combo-activo').checked=true;$('combo-id').disabled=false}
function editarCombo(id){const x=(data.combos||[]).find(i=>i.id===id);if(!x)return;seleccionado=id;$('titulo-form').textContent='Editar combo';$('formulario').hidden=true;$('formulario-combo').hidden=false;$('sin-seleccion').hidden=true;$('combo-id').value=x.id;$('combo-id').disabled=true;$('combo-activo').checked=x.active!==false;$('combo-nombre-es').value=x.name?.es||'';$('combo-nombre-en').value=x.name?.en||'';$('combo-nombre-fr').value=x.name?.fr||'';$('combo-desc-es').value=x.description?.es||'';$('combo-desc-en').value=x.description?.en||'';$('combo-desc-fr').value=x.description?.fr||'';$('combo-items').value=(x.items||[]).join(', ');$('combo-regular').value=x.regularPrice||0;$('combo-descuento').value=x.discountPrice||0}
$('formulario').onsubmit=e=>{e.preventDefault();const item={id:$('id').value.trim(),category:$('categoria').value,active:$('activo').checked,name:{es:$('nombre-es').value,en:$('nombre-en').value,fr:$('nombre-fr').value},description:{es:$('descripcion-es').value,en:$('descripcion-en').value,fr:$('descripcion-fr').value},price:Number($('precio').value)||0};if(!item.id)return;if(seleccionado){const i=data.items.findIndex(x=>x.id===seleccionado);data.items[i]=item}else{if(data.items.some(x=>x.id===item.id)){alert('Ese ID ya existe.');return}data.items.push(item)}seleccionado=item.id;guardar();editar(item.id)};
$('formulario-combo').onsubmit=e=>{e.preventDefault();const combo={id:$('combo-id').value.trim(),active:$('combo-activo').checked,name:{es:$('combo-nombre-es').value,en:$('combo-nombre-en').value,fr:$('combo-nombre-fr').value},description:{es:$('combo-desc-es').value,en:$('combo-desc-en').value,fr:$('combo-desc-fr').value},items:$('combo-items').value.split(',').map(x=>x.trim()).filter(Boolean),regularPrice:Number($('combo-regular').value)||0,discountPrice:Number($('combo-descuento').value)||0};if(!combo.id)return;if(seleccionado){const i=data.combos.findIndex(x=>x.id===seleccionado);data.combos[i]=combo}else{if((data.combos||[]).some(x=>x.id===combo.id)){alert('Ese ID ya existe.');return}data.combos.push(combo)}seleccionado=combo.id;guardar();renderLista();editarCombo(combo.id)};
$('btn-eliminar').onclick=()=>{if(!seleccionado)return;if(confirm('¿Eliminar este plato?')){data.items=data.items.filter(x=>x.id!==seleccionado);seleccionado=null;$('formulario').hidden=true;$('sin-seleccion').hidden=false;guardar();renderLista()}};
$('btn-nuevo').onclick=nuevo;$('btn-nuevo-combo').onclick=nuevoCombo;$('btn-eliminar-combo').onclick=()=>{if(!seleccionado)return;if(confirm('¿Eliminar este combo?')){data.combos=data.combos.filter(x=>x.id!==seleccionado);seleccionado=null;$('formulario-combo').hidden=true;$('sin-seleccion').hidden=false;guardar();renderLista()}};$('buscar').oninput=renderLista;$('filtro').onchange=renderLista;$('btn-exportar').onclick=()=>{const source='/* Generated by admin.html. */\nwindow.menuData='+JSON.stringify(data,null,4)+';\n';const blob=new Blob([source],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu-data.js';a.click();URL.revokeObjectURL(a.href)};inicializar();
</script>
</body></html>
